# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

# Every branch, not just main: gating only main meant the gates did not run at all for as long as
# the work stayed on a branch. The linter, the build and the suite are worth nothing on a branch
# nobody has merged yet.
on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

# A pull request branch is otherwise built twice, once per event.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Lint comments
      run: ./scripts/lint-comments.sh
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal
    - name: Extract tag version
      id: version
      run: |
        if [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9] ]]; then
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "tag_arg=/p:Version=$TAG" >> $GITHUB_OUTPUT
        else
          echo "tag_arg=" >> $GITHUB_OUTPUT
        fi
    - name: Pack NuGet packages
      run: dotnet pack TransportR.sln --configuration Release --no-build --output ./artifacts ${{ steps.version.outputs.tag_arg }}
    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/TransportR*.nupkg
        retention-days: 30

  publish:
    name: Publish NuGet Packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Download NuGet artifacts
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Publish to NuGet.org
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if [ -n "$NUGET_API_KEY" ]; then
          dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        else
          echo "NUGET_API_KEY not set, skipping NuGet.org publish"
        fi
    - name: Publish to GitHub Packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet nuget push ./artifacts/*.nupkg --api-key "$GITHUB_TOKEN" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
